[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "waybar-theme-sync"
version = "1.0.0"
description = "Dynamic Palette Synchronization Engine for Waybar & Wofi"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Ayyappa Pravin", email = "apravint@gmail.com"}
]
keywords = ["waybar", "hyprland", "theming", "linux", "rice", "dotfiles"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Desktop Environment",
]

[project.scripts]
waybar-theme-sync = "waybar_theme_sync.sync:main"
